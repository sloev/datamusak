name: probe
on:
  push:
    branches: [claude/data-to-midi-music-tkk8a3]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          for u in \
            "https://api.energidataservice.dk/dataset/PowerSystemRightNow?limit=1" \
            "https://stables.donkey.bike/api/public/gbfs/3.0/donkey_copenhagen/gbfs.json" \
            "https://gbfs.api.ridedott.com/public/v2/copenhagen/gbfs.json" \
            "https://api.adsb.lol/v2/point/56.0/11.0/250" \
            "https://opendata.adsb.fi/api/v2/lat/56/lon/11/dist/250" \
            "https://driftsdata.statnett.no/restapi/ProductionConsumption/GetLatestDetailedOverview" \
            "https://driftsdata.statnett.no/restapi/PhysicalFlowMap/GetFlow" \
            "https://www.svk.se/services/controlroom/v2/map/price?date=2026-10-03&ticks=1" \
            "https://api.energy-charts.info/public_power?country=dk" \
            "https://api.energy-charts.info/cbet?country=dk" \
            "https://mempool.space/api/v1/fees/recommended" \
            ; do
            echo "=== $u"
            curl -s -m 25 -D hdr.txt -o body.txt -H 'Origin: https://sloev.github.io' "$u" || echo "curl failed $?"
            cat hdr.txt | tr -d '\r' | grep -viE '^(date|set-cookie|strict-transport|x-content|cf-|report-to|nel|server-timing|alt-svc)'
            head -c 400 body.txt; echo
          done
          echo "=== preflight energidataservice"
          curl -s -m 20 -X OPTIONS -D - -o /dev/null -H 'Origin: https://sloev.github.io' -H 'Access-Control-Request-Method: GET' "https://api.energidataservice.dk/dataset/PowerSystemRightNow?limit=1" | tr -d '\r'
          echo "=== mempool ws"
          npx -y wscat@6 -c wss://mempool.space/api/v1/ws -x '{"action":"want","data":["stats"]}' -w 8 2>&1 | head -c 1500 || true
          npx -y wscat@6 -c wss://mempool.space/api/v1/ws -x '{"track-mempool-txids":true}' -w 8 2>&1 | head -c 1500 || true
