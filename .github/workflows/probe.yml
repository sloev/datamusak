name: probe
on:
  push:
    branches: [claude/data-to-midi-music-tkk8a3]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          for u in \
            "https://api.energidataservice.dk/dataset/PowerSystemRightNow?limit=1" \
            "https://api.energidataservice.dk/dataset/PowerSystemRightNow?limit=5&sort=Minutes1UTC%20DESC" \
            "https://api.energidataservice.dk/dataset/CO2Emis?limit=1" \
            "https://stables.donkey.bike/api/public/gbfs/2/donkey_copenhagen/gbfs.json" \
            "https://stables.donkey.bike/api/public/gbfs/2/donkey_cph/gbfs.json" \
            "https://gbfs.donkey.bike/api/public/gbfs/2/donkey_copenhagen/gbfs.json" \
            "https://api.adsb.lol/v2/point/56.0/11.0/250" \
            "https://api.adsb.lol/v2/lat/56.0/lon/11.0/dist/250" \
            "https://api.airplanes.live/v2/point/56/11/250" \
            "https://opendata.adsb.fi/api/v2/lat/56/lon/11/dist/250" \
            "https://api.adsb.one/v2/point/56/11/250" \
            "https://opensky-network.org/api/states/all?lamin=54.4&lomin=7.5&lamax=58&lomax=15.6" \
            "https://mempool.space/api/mempool/recent" \
            "https://api.blockchain.info/haskoin-store/btc/mempool" \
            ; do
            echo "=== $u"
            curl -s -m 25 -D - -o body.txt -H 'Origin: https://sloev.github.io' "$u" | grep -iE '^HTTP|access-control-allow-origin|^location|^content-type' || echo "curl failed $?"
            head -c 300 body.txt; echo
          done
          echo "=== bikeshare systems list"
          curl -s -m 25 https://raw.githubusercontent.com/MobilityData/gbfs/master/systems.csv | grep -iE 'denmark|,DK,|copenhagen|københavn|aarhus|odense' | head -30
