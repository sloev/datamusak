name: Data mirror

# Energinet's Energi Data Service refuses browser (cross-origin) requests, so every 10 minutes this
# copies the last hour of the Danish grid to the `data` branch, which raw.githubusercontent.com
# serves with CORS. The branch is a single, force-pushed commit, so it never grows.
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:
  push:
    branches: [master]
    paths: [scripts/mirror-data.mjs, .github/workflows/data-mirror.yml]

permissions:
  contents: write

concurrency:
  group: data-mirror
  cancel-in-progress: true

jobs:
  mirror:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: scripts
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/mirror-data.mjs out
      - name: Publish to the data branch
        working-directory: out
        run: |
          git init -q -b data
          git config user.name "datamusak-mirror"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "Data mirror $(date -u +%FT%TZ)"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" data
