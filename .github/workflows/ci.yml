name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:unit
      - run: npx playwright install --with-deps chromium firefox webkit
      # every browser in playwright.config.js: Chrome, Firefox, Safari (WebKit), Android Chrome, iPhone Safari
      - run: npm run test:e2e
        env:
          CI: true
      - name: Which browsers passed
        if: always()
        run: node scripts/browser-report.mjs test-results/results.json browsers.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browsers
          path: browsers.json
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  deploy:
    if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: browsers
      - name: Collect site files
        run: |
          mkdir _site
          cp -r index.html manifest.webmanifest sw.js css js assets vendor stats .nojekyll _site/
          # the browsers this exact build was tested on (shown in the footer)
          cp browsers.json _site/stats/browsers.json
          # new cache version per deploy so returning visitors pick up the new shell
          sed -i "s/__VERSION__/${GITHUB_SHA::8}/" _site/sw.js
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
